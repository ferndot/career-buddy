services:
  career-graph:
    build: .
    ports:
      - "127.0.0.1:8080:8000"   # reachable only from this machine
    volumes:
      - ./data:/data              # your facts, settings and saved keys live here, on the host
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the app reach Ollama or LM Studio on this computer, also on Linux
    environment:
      # Optional: an OpenAI-compatible server for model-based extraction.
      - CAREER_GRAPH_LLM_BASE_URL=${CAREER_GRAPH_LLM_BASE_URL:-}
      - CAREER_GRAPH_LLM_MODEL=${CAREER_GRAPH_LLM_MODEL:-}
      - CAREER_GRAPH_LLM_API_KEY=${CAREER_GRAPH_LLM_API_KEY:-}
      # Where uploaded originals go: "local" (default, under ./data/objects) or "s3" (see the "storage" profile below).
      - CAREER_GRAPH_STORAGE=${CAREER_GRAPH_STORAGE:-local}
      - CAREER_GRAPH_S3_ENDPOINT=${CAREER_GRAPH_S3_ENDPOINT:-http://s3:8333}
      - CAREER_GRAPH_S3_BUCKET=${CAREER_GRAPH_S3_BUCKET:-careers}
      - CAREER_GRAPH_S3_ACCESS_KEY=${CAREER_GRAPH_S3_ACCESS_KEY:-careergraph}
      - CAREER_GRAPH_S3_SECRET_KEY=${CAREER_GRAPH_S3_SECRET_KEY:-change-me-please}
    depends_on:
      s3:
        condition: service_started
        required: false             # only started with --profile storage
    restart: unless-stopped

  # Optional S3 server, started only with: docker compose --profile storage up
  # SeaweedFS (Apache-2.0), run unmodified as its own container. MinIO no longer publishes community images.
  s3:
    image: chrislusf/seaweedfs:4.51
    profiles: ["storage"]
    command: server -s3 -dir=/data -ip.bind=0.0.0.0
    ports:
      - "127.0.0.1:8333:8333"     # S3 API, reachable only from this machine
    environment:
      # shortcut: default dev credentials, set your own in .env before storing anything you care about.
      - AWS_ACCESS_KEY_ID=${CAREER_GRAPH_S3_ACCESS_KEY:-careergraph}
      - AWS_SECRET_ACCESS_KEY=${CAREER_GRAPH_S3_SECRET_KEY:-change-me-please}
    volumes:
      - s3-data:/data
    restart: unless-stopped

volumes:
  s3-data:
