domain_id: career
display_name: Career history
description: A person's career history from a resume, profile or job-related text.
entity_types:
  - id: Person
    description: The person whose career this is.
    properties:
      - name: headline
        type: string
        description: Short professional headline, if stated.
  - id: Organization
    description: An employer or a school.
  - id: Position
    description: A job held at an organization. Name it as its title followed by ' at ' and the organization, for example 'Senior Engineer at Acme', so the same title at two employers stays two positions. Use the same full name in its relationships.
    properties:
      - name: period
        type: string
        description: Dates as written, for example "2019 - 2021" or "Jan 2020 - Present".
  - id: Achievement
    description: A concrete accomplishment at a position, stated as a short neutral fact - what was done and what it achieved - not in the text's own resume phrasing. Duties are not achievements.
    properties:
      - name: result
        type: string
        description: The outcome as the text states it, with numbers exactly as written. Empty if none is stated.
      - name: project
        type: string
        description: The project or product it was part of, if the text names one.
  - id: Skill
    description: A professional skill or tool, named as the text names it.
    properties:
      - name: category
        type: string
        description: >-
          The group the text puts the skill under, as written (for example the heading "Languages" or "Cloud" in a
          skills list). If the text gives none, choose exactly one of - Languages, Frameworks & libraries, Data & databases,
          Cloud & infrastructure, Tools & platforms, Practices & methods, Other.
      - name: years
        type: string
        description: Years of experience with it, as the text writes them, for example "5" or "5+". Empty unless the text states a number; never estimate it.
      - name: level
        type: string
        description: Expertise, one of - Beginner, Intermediate, Advanced, Expert. Only when the text's own wording says so (for example "expert in Go"); otherwise empty.
  - id: Education
    description: A degree, certificate or course at a school.
    properties:
      - name: period
        type: string
        description: Dates as written.
relationship_types:
  - id: HAS_POSITION
    description: The person held this position.
    valid_source_types: [Person]
    valid_target_types: [Position]
  - id: HAS_EDUCATION
    description: The person has this education.
    valid_source_types: [Person]
    valid_target_types: [Education]
  - id: HAS_SKILL
    description: The person has this skill.
    valid_source_types: [Person]
    valid_target_types: [Skill]
  - id: AT
    description: The position is at this employer.
    valid_source_types: [Position]
    valid_target_types: [Organization]
  - id: ACHIEVED
    description: The position included this achievement.
    valid_source_types: [Position]
    valid_target_types: [Achievement]
  - id: USES_SKILL
    description: The position or achievement used this skill.
    valid_source_types: [Position, Achievement]
    valid_target_types: [Skill]
  - id: ATTENDED
    description: The education was at this school.
    valid_source_types: [Education]
    valid_target_types: [Organization]
extraction_prompt_template: |
  You extract a career history from a person's own text (a resume, a profile, or notes about a job).

  Extract the following types of entities:
  {entity_descriptions}

  Extract the following types of relationships:
  {relationship_descriptions}

  Use only facts the text states. Use each organization, position, school and skill name exactly as the text spells it.
  Achievements are concrete accomplishments, not duties. Describe each one as a neutral statement of what was done and
  its result, in your own words; keep its numbers and project. Put dates as written in the period property.
  Give each skill a category: the one the text states (a "Languages:" or "Cloud:" heading), otherwise one of Languages,
  Frameworks & libraries, Data & databases, Cloud & infrastructure, Tools & platforms, Practices & methods, Other.
  Tools, technologies and methods an achievement names are skills, not part of the achievement: list each as its own Skill
  (category "Tools & platforms" unless another fits better), linked to that achievement with USES_SKILL (and to its position), and never inside the
  achievement's text or properties. A tool named both in a skills list and in an achievement is one skill.
  Fill a skill's years and level only when the text states them; leave them empty otherwise.
