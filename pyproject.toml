[project]
name = "career-buddy"
version = "0.1.0"
description = "Import career data, keep it as a graph of facts, and generate resumes and cover letters from it."
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Fern", email = "1479244+ferndot@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.3",
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "langchain-core>=1.8.2",
    "langchain-openai>=1.8.1",
    "langgraph>=1.2.22",
    "pdfminer-six>=20260107",
    "playwright>=1.65.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "redstring>=0.13,<0.14",
    "uvicorn>=0.54.0",
]

[project.scripts]
career-buddy = "career_buddy:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "moto[s3]>=5.2.5",
    "mutmut>=3.8.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = ["live: calls a real LLM provider, only when CAREER_BUDDY_LIVE_<PROVIDER>_KEY is set"]

[tool.mutmut]
source_paths = ["src/career_buddy/domain/"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-p", "no:cacheprovider"]
also_copy = ["src/career_buddy/adapters", "src/career_buddy/application", "src/career_buddy/web", "src/career_buddy/__init__.py", "src/career_buddy/composition.py"]
