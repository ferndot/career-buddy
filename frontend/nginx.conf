server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The API is the backend container. Same origin for the browser, so no CORS is needed in Docker.
    location /api/ {
        proxy_pass http://career-graph:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 11m;  # the backend caps uploads at 10 MB
    }

    # Single-page app: unknown paths load index.html so the React router handles them.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
